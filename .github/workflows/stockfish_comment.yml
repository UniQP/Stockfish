name: Comment on the pull request

# read-write repo token
# access to secrets
on:
  workflow_run:
    workflows: ["Stockfish"]
    types:
      - completed

jobs:
  Comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Debug output
        id: set-result
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            return context.payload.workflow_run.id
      - name: Get result
        run: echo "ID ${{steps.set-result.outputs.result}}"
      - name: Debug output
        id: set-result-2
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            return context.payload.workflow_run.pull_requests
      - name: Get result
        run: echo "ID ${{steps.set-result-2.outputs.result}}"
